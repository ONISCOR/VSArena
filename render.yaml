# Assumption: same Dockerfile as Oracle/Fly. Secrets are sync:false — set only in Render Dashboard (never commit values).
services:
  - type: web
    name: vsarena-harness
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VSARENA_APP_URL
        value: https://www.vsarena.app
      # Set these in the Render dashboard only (Environment → Secret).
      - key: HARNESS_INGEST_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Ed25519 for signed run manifests (private on harness; public also on Vercel).
      - key: VSARENA_RESULTS_ED25519_PRIVATE
        sync: false
      - key: VSARENA_RESULTS_ED25519_PUBLIC
        sync: false
      - key: VSARENA_HELD_OUT_JSON
        sync: false
